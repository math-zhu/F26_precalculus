<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="380">
  <title>Vertical shift of a line through the origin by amount b, showing the parallel shifted line and its y-intercept (0,b)</title>
  <defs>
    <marker id="arrow-shift" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="300" height="260" fill="#ffffff"/>
  <line x1="20" y1="220" x2="280" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arrow-shift)"/>
  <line x1="40" y1="240" x2="40" y2="15" stroke="#333333" stroke-width="2" marker-end="url(#arrow-shift)"/>
  <text x="24" y="234" font-size="12" fill="#333333">O</text>

  <line x1="20" y1="240" x2="220" y2="40" stroke="#2563eb" stroke-width="2.5"/>
  <text x="222" y="42" font-size="13" fill="#2563eb">&#8467;&#8320;: y = x</text>

  <line x1="20" y1="160" x2="160" y2="20" stroke="#ea580c" stroke-width="2.5"/>
  <text x="163" y="22" font-size="13" fill="#ea580c">&#8467;: y = x + b</text>

  <line x1="80" y1="180" x2="80" y2="100" stroke="#333333" stroke-width="1.5" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/>
  <text x="88" y="145" font-size="13" fill="#333333">b</text>

  <circle cx="40" cy="140" r="3.5" fill="#ea580c"/>
  <text x="46" y="137" font-size="12" fill="#ea580c">(0, b)</text>
</svg>
