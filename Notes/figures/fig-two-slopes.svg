<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="340">
  <title>Two lines through the origin with different slopes, y=2x and y=0.5x, meeting only at the origin</title>
  <defs>
    <marker id="arrow-two" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="220" fill="#ffffff"/>
  <line x1="15" y1="200" x2="245" y2="200" stroke="#333333" stroke-width="2" marker-end="url(#arrow-two)"/>
  <line x1="30" y1="215" x2="30" y2="15" stroke="#333333" stroke-width="2" marker-end="url(#arrow-two)"/>
  <circle cx="30" cy="200" r="3.5" fill="#333333"/>
  <text x="14" y="212" font-size="12" fill="#333333">O</text>

  <line x1="30" y1="200" x2="115" y2="30" stroke="#2563eb" stroke-width="2.5"/>
  <text x="118" y="28" font-size="13" fill="#2563eb">y = 2x</text>

  <line x1="30" y1="200" x2="230" y2="100" stroke="#ea580c" stroke-width="2.5"/>
  <text x="188" y="92" font-size="13" fill="#ea580c">y = 0.5x</text>
</svg>
