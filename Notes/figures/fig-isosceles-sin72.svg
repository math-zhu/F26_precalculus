<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">An isosceles triangle gives sine and cosine of 72 degrees, or 2 pi over 5</title>
  <desc id="desc">Two views of triangle ACD, with apex angle 36 degrees or pi over 5, base angles 72 degrees or 2 pi over 5, equal sides d, and base 1. On the left, angle bisector CF gives AF and CF equal to 1 and FD equal to d minus 1. On the right, altitude AH divides the base into halves, so cosine of 72 degrees equals one half divided by d.</desc>
  <rect width="760" height="400" fill="white"/>
  <g fill="none" stroke-linejoin="round">
    <path d="M106 323.532 L190 65 L274 323.532 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.3"/>
    <path d="M106 323.532 L241.915 224.782" stroke="#dc2626" stroke-width="1.8"/>
    <path d="M486 323.532 L570 65 L654 323.532 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2.3"/>
    <path d="M570 65 V323.532" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M570 311.532 H582 V323.532" stroke="#374151" stroke-width="1.2"/>
  </g>
  <circle cx="241.915" cy="224.782" r="3" fill="#dc2626"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#111827" text-anchor="middle">
    <text x="190" y="25">Similarity</text>
    <text x="570" y="25">Right-triangle ratio</text>
    <text x="190" y="52">A</text>
    <text x="94" y="345">C</text>
    <text x="286" y="345">D</text>
    <text x="259" y="224" fill="#dc2626">F</text>
    <text x="134" y="193" fill="#2563eb">d</text>
    <text x="190" y="348">1</text>
    <text x="236" y="143">1</text>
    <text x="286" y="278">d − 1</text>
    <text x="169" y="267" fill="#dc2626">1</text>
    <text x="190" y="111" font-size="15">36°</text>
    <text x="146" y="315" font-size="14">36°</text>
    <text x="129" y="285" font-size="14">36°</text>
    <text x="246" y="315" font-size="15">72°</text>
    <text x="570" y="52">A</text>
    <text x="474" y="345">C</text>
    <text x="666" y="345">D</text>
    <text x="570" y="348">H</text>
    <text x="514" y="193" fill="#2563eb">d</text>
    <text x="626" y="193" fill="#2563eb">d</text>
    <text x="528" y="348">1/2</text>
    <text x="612" y="348">1/2</text>
    <text x="526" y="315" font-size="15">72°</text>
    <text x="380" y="386" font-size="16">36° = π/5; 72° = 2π/5</text>
  </g>
</svg>
